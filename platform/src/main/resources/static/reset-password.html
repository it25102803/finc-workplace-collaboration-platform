<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Finc Workplace</title>
    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #fff;
            padding: 40px 36px;
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
        }
        h1 { font-size: 22px; margin: 0 0 8px; }
        p.sub { color: #666; font-size: 14px; margin: 0 0 24px; }
        label { display: block; font-size: 13px; margin-bottom: 6px; color: #333; }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 14px;
        }
        button {
            margin-top: 6px;
            width: 100%;
            padding: 11px;
            background: #1e3a8a;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover { background: #152b6b; }
        button:disabled { background: #999; cursor: not-allowed; }
        .msg { margin-top: 16px; font-size: 14px; }
        .ok { color: #047857; }
        .err { color: #b91c1c; }
        .hidden { display: none; }
        .back { display: block; margin-top: 20px; text-align: center; font-size: 13px; color: #1e3a8a; }
    </style>
</head>
<body>
<div class="card">
    <h1>Set a new password</h1>
    <p class="sub">Choose a password with at least 6 characters.</p>

    <form id="resetForm">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" required minlength="6" placeholder="••••••••">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" required minlength="6" placeholder="••••••••">
        <button type="submit" id="submitBtn">Reset password</button>
    </form>

    <div class="msg" id="msg"></div>
    <a href="index.html" class="back">← Back to login</a>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get("token");
const msg = document.getElementById("msg");
const form = document.getElementById("resetForm");
const btn = document.getElementById("submitBtn");

// If no token in URL, hide form and show error
if (!token) {
    form.classList.add("hidden");
    msg.textContent = "Missing reset token. Use the link from your email.";
    msg.classList.add("err");
} else {
    // Validate token before showing the form
    fetch(`/api/auth/validate-reset-token?token=${encodeURIComponent(token)}`)
        .then(r => r.json())
        .then(d => {
            if (!d.valid) {
                form.classList.add("hidden");
                msg.textContent = "This reset link is invalid or has expired. Please request a new one.";
                msg.classList.add("err");
            }
        })
        .catch(() => {});
}

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const pwd = document.getElementById("newPassword").value;
    const confirm = document.getElementById("confirmPassword").value;

    msg.textContent = "";
    msg.className = "msg";

    if (pwd !== confirm) {
        msg.textContent = "Passwords do not match.";
        msg.classList.add("err");
        return;
    }

    btn.disabled = true;
    btn.textContent = "Resetting...";

    try {
        const res = await fetch("/api/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, newPassword: pwd })
        });
        const data = await res.json().catch(() => ({}));

        if (res.ok) {
            msg.textContent = data.message || "Password reset. Redirecting to login...";
            msg.classList.add("ok");
            setTimeout(() => { window.location.href = "index.html"; }, 2000);
        } else {
            msg.textContent = typeof data === "string" ? data : (data.message || "Reset failed.");
            msg.classList.add("err");
            btn.disabled = false;
            btn.textContent = "Reset password";
        }
    } catch (err) {
        msg.textContent = "Something went wrong. Try again.";
        msg.classList.add("err");
        btn.disabled = false;
        btn.textContent = "Reset password";
    }
});
</script>
</body>
</html>
