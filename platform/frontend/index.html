<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Platform - Auth</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .auth-card { max-width: 450px; margin: 80px auto; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .btn-primary { background-color: #0d6efd; border: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="card auth-card p-4 bg-white">
        <h3 class="text-center fw-bold mb-4 text-primary">Enterprise Portal</h3>
        
        <!-- Navigation Tabs -->
        <ul class="nav nav-pills nav-justified mb-3" id="authTab" role="tablist">
            <li class="nav-item">
                <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button">Login</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button">Register</button>
            </li>
        </ul>

        <div id="alertBox" class="alert d-none mt-2" role="alert"></div>

        <div class="tab-content">
            <!-- LOGIN FORM -->
            <div class="tab-pane fade show active" id="login">
                <form id="loginForm" class="mt-3">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" id="loginUsername" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="loginPassword" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
                </form>
            </div>

            <!-- REGISTER FORM -->
            <div class="tab-pane fade" id="register">
                <form id="registerForm" class="mt-3">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" id="regUsername" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="regEmail" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" id="regFirstName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Last Name</label>
                        <input type="text" id="regLastName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="regPassword" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 py-2">Create Account</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_BASE = "http://localhost:8081/api/auth";

    function showAlert(message, isSuccess) {
        const alertBox = document.getElementById("alertBox");
        alertBox.className = `alert ${isSuccess ? 'alert-success' : 'alert-danger'} mt-2`;
        alertBox.textContent = message;
        alertBox.classList.remove("d-none");
    }

    // Login Submission
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const payload = {
            username: document.getElementById("loginUsername").value,
            password: document.getElementById("loginPassword").value
        };

        try {
            const res = await fetch(`${API_BASE}/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (res.ok) {
                showAlert("Login Successful! Redirecting...", true);
                localStorage.setItem("user", JSON.stringify(data));
            } else {
                showAlert(data.message || "Invalid credentials", false);
            }
        } catch (err) {
            showAlert("Server unreachable. Ensure Spring Boot is running on port 8080.", false);
        }
    });

    // Register Submission
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const payload = {
            username: document.getElementById("regUsername").value,
            email: document.getElementById("regEmail").value,
            firstName: document.getElementById("regFirstName").value,
            lastName: document.getElementById("regLastName").value,
            password: document.getElementById("regPassword").value
        };

        try {
            const res = await fetch(`${API_BASE}/register`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (res.ok) {
                showAlert("Account registered successfully! Please log in.", true);
            } else {
                showAlert(data.message || "Registration failed", false);
            }
        } catch (err) {
            showAlert("Server unreachable. Ensure Spring Boot is running on port 8080.", false);
        }
    });
</script>
</body>
</html>
