<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Finc Workplace</title>

    <!-- Apply theme before paint -->
    <script>
        (function () {
            try {
                const saved = localStorage.getItem("theme") || "light";
                document.documentElement.setAttribute("data-theme", saved);
            } catch (e) {}
        })();
    </script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/theme.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .auth-wrap {
            width: 100%;
            max-width: 420px;
        }

        .card {
            background: var(--surface);
            padding: 40px 36px;
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            width: 100%;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }
        .brand-row img {
            width: 44px;
            height: 44px;
            object-fit: contain;
            background: #ffffff;
            padding: 5px;
            border-radius: 10px;
        }
        .brand-row strong {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 0 0 8px;
            color: var(--text);
        }
        p.sub {
            color: var(--text-2);
            font-size: 0.9rem;
            margin: 0 0 24px;
            line-height: 1.5;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-2);
        }
        input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.9rem;
            box-sizing: border-box;
            background: var(--surface-2);
            color: var(--text);
            transition: all 0.2s ease;
            font-family: inherit;
        }
        input::placeholder { color: var(--text-3); }
        input:focus {
            outline: none;
            background: var(--surface);
            border-color: var(--accent);
            box-shadow: var(--focus-ring);
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: var(--accent-contrast);
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            box-shadow: 0 4px 14px rgba(30, 136, 229, 0.25);
        }
        button:hover:not(:disabled) {
            background: var(--accent-2);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(30, 136, 229, 0.35);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .msg {
            margin-top: 16px;
            font-size: 0.875rem;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid transparent;
            display: none;
            font-weight: 500;
        }
        .msg.show { display: flex; align-items: center; gap: 10px; }
        .msg.ok {
            background: var(--success-bg);
            color: var(--success-text);
            border-color: var(--success-border);
        }
        .msg.err {
            background: var(--danger-bg);
            color: var(--danger-text);
            border-color: var(--danger-border);
        }

        .back {
            display: block;
            margin-top: 22px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
        }
        .back:hover {
            color: var(--accent-2);
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .card { padding: 32px 24px; }
        }
    </style>
    <link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body>

<button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle theme">
    <i class="fa-solid fa-moon"></i>
</button>

<div class="auth-wrap">
    <div class="card">

        <div class="brand-row">
            <img src="images/finc-logo.png" alt="Finc" onerror="this.src='https://via.placeholder.com/44?text=FINC'">
            <strong>Finc Enterprise</strong>
        </div>

        <h1>Forgot your password?</h1>
        <p class="sub">Enter your email and we'll send you a reset link.</p>

        <form id="forgotForm">
            <label for="email">Email address</label>
            <input type="email" id="email" required placeholder="you@finc.com" autocomplete="email">
            <button type="submit" id="submitBtn">
                <i class="fa-solid fa-paper-plane"></i> Send reset link
            </button>
        </form>

        <div class="msg" id="msg"></div>
        <a href="index.html" class="back">
            <i class="fa-solid fa-arrow-left"></i> Back to login
        </a>
    </div>
</div>

<script src="js/theme.js" defer></script>
<script>
document.getElementById("forgotForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const msg = document.getElementById("msg");
    const btn = document.getElementById("submitBtn");

    msg.textContent = "";
    msg.className = "msg";
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';

    try {
        const res = await fetch("/api/auth/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
        });
        const data = await res.json();
        msg.className = "msg show ok";
        msg.innerHTML = '<i class="fa-solid fa-circle-check"></i> ' +
            (data.message || "Check your email for a reset link.");
    } catch (err) {
        msg.className = "msg show err";
        msg.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Something went wrong. Try again.';
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send reset link';
    }
});
</script>
</body>
</html>
