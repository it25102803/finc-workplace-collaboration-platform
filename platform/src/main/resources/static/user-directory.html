<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory - Finc Enterprise Portal</title>

    <!-- Apply theme before paint -->
    <script>
        (function () {
            try {
                const saved = localStorage.getItem("theme") || "light";
                document.documentElement.setAttribute("data-theme", saved);
            } catch (e) {}
        })();
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/theme.css" rel="stylesheet">

    <style>
        /* ============================================================
           User Directory — page-specific styles
           ============================================================ */
        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .page-heading {
            color: var(--text);
            margin-bottom: 4px;
        }
        .page-subheading {
            color: var(--text-2);
            font-size: 0.9rem;
            margin: 0;
        }

        .user-profile-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--surface);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            text-decoration: none;
            color: var(--text);
            transition: box-shadow 0.2s, transform 0.2s, background-color 0.3s, border-color 0.3s;
        }
        .user-profile-badge:hover {
            box-shadow: 0 4px 14px rgba(30, 136, 229, 0.15);
            transform: translateY(-1px);
            color: var(--text);
        }
        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border-radius: 50%;
        }

        .directory-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        /* Table */
        .table-custom {
            --bs-table-bg: transparent;
            color: var(--text);
        }
        .table-custom th {
            background: var(--surface-2);
            color: var(--text-3);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
        }
        .table-custom td {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
            font-size: 0.9rem;
            color: var(--text);
            background: transparent;
        }
        .table-custom tbody tr:hover td {
            background: var(--surface-2);
        }
        .table-custom tbody tr:last-child td {
            border-bottom: none;
        }

        /* Badges */
        .badge-role {
            display: inline-block;
            background-color: var(--accent-soft);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
        }
        .badge-admin {
            display: inline-block;
            background-color: #f3e8ff;
            color: #a855f7;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
        }
        [data-theme="dark"] .badge-admin {
            background-color: rgba(168, 85, 247, 0.15);
            color: #c084fc;
        }
        .badge-online {
            display: inline-block;
            background-color: var(--success-bg);
            color: var(--success-text);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
        }
        .badge-offline {
            display: inline-block;
            background-color: var(--surface-2);
            color: var(--text-3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
        }
    </style>
    <link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body>

<div class="app-sidebar">
    <div class="sidebar-brand">
        <img src="images/finc-logo.png" alt="Finc Logo" class="sidebar-brand-logo" onerror="this.src='https://via.placeholder.com/40?text=FINC'">
        <span>Enterprise Portal</span>
    </div>
    <nav>
        <a href="dashboard.html" class="nav-link-custom"><i class="fa-solid fa-chart-pie"></i> Overview</a>
        <a href="user-directory.html" id="userDirectoryLink" class="nav-link-custom active" style="display: none;"><i class="fa-solid fa-users"></i> User Directory</a>
        <a href="channels.html" class="nav-link-custom"><i class="fa-solid fa-comments"></i> Channels & Chat</a>
        <a href="tasks.html" class="nav-link-custom"><i class="fa-solid fa-list-check"></i> Task Management</a>
        <a href="calendar.html" class="nav-link-custom"><i class="fa-solid fa-calendar-days"></i> Calendar & Meetings</a>
        <a href="files.html" class="nav-link-custom"><i class="fa-solid fa-folder-open"></i> File Manager</a>
        <a href="knowledge-base.html" class="nav-link-custom"><i class="fa-solid fa-book"></i> Knowledge Base</a>
        <a href="admin-settings.html" id="adminSettingsLink" class="nav-link-custom" style="display: none;"><i class="fa-solid fa-gear"></i> Admin Settings</a>
    </nav>
</div>

<div class="app-main">
    <div class="top-navbar">
        <div>
            <h3 class="fw-bold page-heading">Centralized User Directory</h3>
            <p class="page-subheading">Manage team access, departments, and active statuses</p>
        </div>
        <div class="d-flex align-items-center gap-3">
            <!-- Theme toggle (NFR-14) -->
            <button type="button" class="theme-toggle-inline" data-theme-toggle aria-label="Toggle theme">
                <i class="fa-solid fa-moon"></i>
            </button>

            <a href="profile.html" class="user-profile-badge">
                <span class="status-dot"></span>
                <span class="fw-semibold" id="displayName" style="font-size: 0.9rem;">User Session</span>
                <span class="app-badge app-badge-accent" id="userRoleBadge">Employee</span>
            </a>
            <a href="dashboard.html" class="btn btn-outline-secondary btn-sm px-3 rounded-pill fw-semibold">
                <i class="fa-solid fa-arrow-left me-1"></i> Dashboard
            </a>
        </div>
    </div>

    <div class="directory-card">
        <div class="table-responsive">
            <table class="table table-custom align-middle mb-0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>NAME</th>
                        <th>EMAIL</th>
                        <th>DEPARTMENT</th>
                        <th>ROLE</th>
                        <th>STATUS</th>
                    </tr>
                </thead>
                <tbody id="userTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="js/theme.js" defer></script>
<script src="js/user-directory.js"></script>
<script src="js/presence.js"></script>
<script src="js/roleguard.js"></script>
<script>
    // Populate the top-right badge from localStorage with friendly role name
    (function () {
        const name = localStorage.getItem("username") || "User Session";
        const rawRole = localStorage.getItem("role") || "ROLE_EMPLOYEE";

        const dn = document.getElementById("displayName");
        const rb = document.getElementById("userRoleBadge");
        if (dn) dn.textContent = name;
        if (rb) rb.textContent = friendlyRole(rawRole);
    })();

    // Same mapping used on the dashboard — matches report Section 1.2
    function friendlyRole(raw) {
        if (!raw) return "Employee";
        const cleaned = String(raw).replace(/^ROLE_/, "").toUpperCase();
        const map = {
            SYSTEM_ADMIN: "System Administrator",
            DEPT_ADMIN: "Department Administrator",
            TEAM_LEADER: "Team Leader",
            EMPLOYEE: "Employee"
        };
        if (map[cleaned]) return map[cleaned];
        return cleaned.toLowerCase().replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
    }
</script>
</body>
</html>
