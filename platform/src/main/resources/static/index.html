<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Portal - Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-container {
            width: 100%;
            max-width: 460px;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 30px;
        }
        .brand-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .brand-logo {
    max-width: 140px;          
    height: auto;
    object-fit: contain;       
    border-radius: 6px;        
    margin-bottom: 12px;
    background: transparent; 
    box-shadow: none;          
        }
        .brand-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 2px;
        }
        .brand-subtitle {
            font-size: 0.85rem;
            color: #64748b;
        }
        .nav-pills {
            background: #f1f5f9;
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        .nav-pills .nav-link {
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #64748b;
            transition: all 0.2s ease;
        }
        .nav-pills .nav-link.active {
            background-color: #2563eb;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .form-label {
            font-size: 0.825rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        .input-group-text {
            background: #f8fafc;
            border-right: none;
            color: #94a3b8;
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
        }
        .form-control {
            border-left: none;
            background: #f8fafc;
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
            font-size: 0.9rem;
            padding: 10px 12px;
        }
        .form-control:focus {
            box-shadow: none;
            background: #ffffff;
            border-color: #cbd5e1;
        }
        .input-group:focus-within .input-group-text {
            background: #ffffff;
            border-color: #cbd5e1;
            color: #2563eb;
        }
        .btn-custom {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            font-weight: 600;
            border-radius: 10px;
            padding: 12px;
            border: none;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
            transition: transform 0.2s ease;
        }
        .btn-custom:hover {
            transform: translateY(-1px);
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <!-- Logo & Branding Header -->
        <div class="brand-header">
            <img src="images/finc-logo.png" alt="Finc Academy Logo" class="brand-logo" onerror="this.src='https://via.placeholder.com/75?text=FINC'">
            <div class="brand-title">Enterprise Portal</div>
            <div class="brand-subtitle">Finc Academy & Consultants</div>
        </div>

        <!-- Navigation Tabs -->
        <ul class="nav nav-pills nav-justified" id="authTab" role="tablist">
            <li class="nav-item">
                <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button">Sign In</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button">Register</button>
            </li>
        </ul>

        <!-- Alert Notification Box -->
        <div id="alertBox" class="alert d-none mt-2 text-center" role="alert"></div>

        <div class="tab-content">
            <!-- LOGIN FORM -->
            <div class="tab-pane fade show active" id="login">
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                            <input type="text" id="loginUsername" class="form-control" placeholder="Enter your username" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-custom w-100 mt-2">Log In to Workspace</button>
                </form>
            </div>

            <!-- REGISTER FORM -->
            <div class="tab-pane fade" id="register">
                <form id="registerForm">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-at"></i></span>
                            <input type="text" id="regUsername" class="form-control" placeholder="johndoe" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" id="regEmail" class="form-control" placeholder="name@finc.com" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label">First Name</label>
                            <input type="text" id="regFirstName" class="form-control" placeholder="John" style="border-left: 1px solid #dee2e6; border-radius: 10px;" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label">Last Name</label>
                            <input type="text" id="regLastName" class="form-control" placeholder="Doe" style="border-left: 1px solid #dee2e6; border-radius: 10px;" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                            <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-custom w-100 mt-2" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">Create Account</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_BASE = "http://localhost:8081/api/auth";

    function showAlert(message, isSuccess) {
        const alertBox = document.getElementById("alertBox");
        alertBox.className = `alert ${isSuccess ? 'alert-success' : 'alert-danger'} mt-2`;
        alertBox.textContent = message;
        alertBox.classList.remove("d-none");
    }

    // Login Submission
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const usernameInput = document.getElementById("loginUsername").value;
        const payload = {
            username: usernameInput,
            password: document.getElementById("loginPassword").value
        };

        try {
            const res = await fetch(`${API_BASE}/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (res.ok) {
                showAlert("Login Successful! Redirecting...", true);
                
                localStorage.setItem("user", JSON.stringify(data));
                localStorage.setItem("username", usernameInput);
                
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 800);
            } else {
                showAlert(data.message || "Invalid credentials", false);
            }
        } catch (err) {
            showAlert("Server unreachable. Ensure Spring Boot is running on port 8081.", false);
        }
    });

    // Register Submission
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const payload = {
            username: document.getElementById("regUsername").value,
            email: document.getElementById("regEmail").value,
            firstName: document.getElementById("regFirstName").value,
            lastName: document.getElementById("regLastName").value,
            password: document.getElementById("regPassword").value
        };

        try {
            const res = await fetch(`${API_BASE}/register`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (res.ok) {
                showAlert("Account registered successfully! Please log in.", true);
                const loginTab = new bootstrap.Tab(document.getElementById("login-tab"));
                loginTab.show();
            } else {
                showAlert(data.message || "Registration failed", false);
            }
        } catch (err) {
            showAlert("Server unreachable. Ensure Spring Boot is running on port 8081.", false);
        }
    });
</script>
</body>
</html>
