<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Finc Workplace</title>

    <!-- Apply theme before paint -->
    <script>
        (function () {
            try {
                const saved = localStorage.getItem("theme") || "light";
                document.documentElement.setAttribute("data-theme", saved);
            } catch (e) {}
        })();
    </script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/theme.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .auth-wrap {
            width: 100%;
            max-width: 420px;
        }

        .card {
            background: var(--surface);
            padding: 40px 36px;
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            width: 100%;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }
        .brand-row img {
            width: 44px;
            height: 44px;
            object-fit: contain;
            background: #ffffff;
            padding: 5px;
            border-radius: 10px;
        }
        .brand-row strong {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 0 0 8px;
            color: var(--text);
        }
        p.sub {
            color: var(--text-2);
            font-size: 0.9rem;
            margin: 0 0 24px;
            line-height: 1.5;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-2);
        }
        input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.9rem;
            box-sizing: border-box;
            background: var(--surface-2);
            color: var(--text);
            transition: all 0.2s ease;
            font-family: inherit;
            margin-bottom: 14px;
        }
        input::placeholder { color: var(--text-3); }
        input:focus {
            outline: none;
            background: var(--surface);
            border-color: var(--accent);
            box-shadow: var(--focus-ring);
        }

        button {
            margin-top: 6px;
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: var(--accent-contrast);
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            box-shadow: 0 4px 14px rgba(30, 136, 229, 0.25);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:hover:not(:disabled) {
            background: var(--accent-2);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(30, 136, 229, 0.35);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .msg {
            margin-top: 16px;
            font-size: 0.875rem;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid transparent;
            display: none;
            font-weight: 500;
        }
        .msg.show { display: flex; align-items: center; gap: 10px; }
        .msg.ok {
            background: var(--success-bg);
            color: var(--success-text);
            border-color: var(--success-border);
        }
        .msg.err {
            background: var(--danger-bg);
            color: var(--danger-text);
            border-color: var(--danger-border);
        }

        .hidden { display: none; }

        .back {
            display: block;
            margin-top: 22px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
        }
        .back:hover {
            color: var(--accent-2);
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .card { padding: 32px 24px; }
        }
    </style>
    <link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body>

<button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle theme">
    <i class="fa-solid fa-moon"></i>
</button>

<div class="auth-wrap">
    <div class="card">

        <div class="brand-row">
            <img src="images/finc-logo.png" alt="Finc" onerror="this.src='https://via.placeholder.com/44?text=FINC'">
            <strong>Finc Enterprise</strong>
        </div>

        <h1>Set a new password</h1>
        <p class="sub">Choose a password with at least 6 characters.</p>

        <form id="resetForm">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" required minlength="6" placeholder="••••••••" autocomplete="new-password">
            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" required minlength="6" placeholder="••••••••" autocomplete="new-password">
            <button type="submit" id="submitBtn">
                <i class="fa-solid fa-shield-halved"></i> Reset password
            </button>
        </form>

        <div class="msg" id="msg"></div>
        <a href="index.html" class="back">
            <i class="fa-solid fa-arrow-left"></i> Back to login
        </a>
    </div>
</div>

<script src="js/theme.js" defer></script>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get("token");
const msg = document.getElementById("msg");
const form = document.getElementById("resetForm");
const btn = document.getElementById("submitBtn");

// If no token in URL, hide form and show error
if (!token) {
    form.classList.add("hidden");
    msg.className = "msg show err";
    msg.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Missing reset token. Use the link from your email.';
} else {
    // Validate token before showing the form
    fetch(`/api/auth/validate-reset-token?token=${encodeURIComponent(token)}`)
        .then(r => r.json())
        .then(d => {
            if (!d.valid) {
                form.classList.add("hidden");
                msg.className = "msg show err";
                msg.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> This reset link is invalid or has expired. Please request a new one.';
            }
        })
        .catch(() => {});
}

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const pwd = document.getElementById("newPassword").value;
    const confirm = document.getElementById("confirmPassword").value;

    msg.textContent = "";
    msg.className = "msg";

    if (pwd !== confirm) {
        msg.className = "msg show err";
        msg.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Passwords do not match.';
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Resetting...';

    try {
        const res = await fetch("/api/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, newPassword: pwd })
        });
        const data = await res.json().catch(() => ({}));

        if (res.ok) {
            msg.className = "msg show ok";
            msg.innerHTML = '<i class="fa-solid fa-circle-check"></i> ' +
                (data.message || "Password reset. Redirecting to login...");
            setTimeout(() => { window.location.href = "index.html"; }, 2000);
        } else {
            msg.className = "msg show err";
            msg.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> ' +
                (typeof data === "string" ? data : (data.message || "Reset failed."));
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-shield-halved"></i> Reset password';
        }
    } catch (err) {
        msg.className = "msg show err";
        msg.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Something went wrong. Try again.';
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-shield-halved"></i> Reset password';
    }
});
</script>
</body>
</html>
