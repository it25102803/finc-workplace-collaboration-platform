<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Finc Workplace</title>
    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #fff;
            padding: 40px 36px;
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
        }
        h1 { font-size: 22px; margin: 0 0 8px; }
        p.sub { color: #666; font-size: 14px; margin: 0 0 24px; }
        label { display: block; font-size: 13px; margin-bottom: 6px; color: #333; }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 11px;
            background: #1e3a8a;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover { background: #152b6b; }
        .msg { margin-top: 16px; font-size: 14px; }
        .ok { color: #047857; }
        .err { color: #b91c1c; }
        .back { display: block; margin-top: 20px; text-align: center; font-size: 13px; color: #1e3a8a; }
    </style>
</head>
<body>
<div class="card">
    <h1>Forgot your password?</h1>
    <p class="sub">Enter your email and we'll send you a reset link.</p>

    <form id="forgotForm">
        <label for="email">Email address</label>
        <input type="email" id="email" required placeholder="you@finc.com">
        <button type="submit" id="submitBtn">Send reset link</button>
    </form>

    <div class="msg" id="msg"></div>
    <a href="index.html" class="back">← Back to login</a>
</div>

<script>
document.getElementById("forgotForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const msg = document.getElementById("msg");
    const btn = document.getElementById("submitBtn");

    msg.textContent = "";
    msg.className = "msg";
    btn.disabled = true;
    btn.textContent = "Sending...";

    try {
        const res = await fetch("/api/auth/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
        });
        const data = await res.json();
        msg.textContent = data.message || "Check your email for a reset link.";
        msg.classList.add("ok");
    } catch (err) {
        msg.textContent = "Something went wrong. Try again.";
        msg.classList.add("err");
    } finally {
        btn.disabled = false;
        btn.textContent = "Send reset link";
    }
});
</script>
</body>
</html>
