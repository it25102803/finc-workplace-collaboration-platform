<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management | FINC Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/tasks.css">
</head>
<body>
<div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-logo-card">
                <img src="images/finc-logo.png" alt="Finc Academy & Consultants" class="brand-logo-img" onerror="this.onerror=null; this.src='images/Finc_Main.jpg';">
            </div>
            <div class="brand-portal-title">
                <span class="title">Enterprise</span>
                <span class="subtitle">Portal</span>
            </div>
        </div>
        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i> Dashboard</a>
            <a href="tasks.html" class="nav-item active"><i class="fa-solid fa-list-check"></i> Tasks</a>
            <a href="calendar.html" class="nav-item"><i class="fa-solid fa-calendar-days"></i> Calendar</a>
            <a href="files.html" class="nav-item"><i class="fa-solid fa-folder"></i> Files</a>
        </nav>
    </aside>

    <!-- Main Task Board -->
    <main class="main-content">
        <header class="top-header">
            <div>
                <h1 class="page-title">Task Management</h1>
                <p class="page-desc">Assign tasks to team members, update progress, and track deadlines.</p>
            </div>

            <div class="header-actions">
                <button class="btn btn-primary" id="btnOpenTaskModal">
                    <i class="fa-solid fa-plus"></i> New Task
                </button>
            </div>
        </header>

        <!-- Kanban Columns -->
        <div class="kanban-board">
            <div class="kanban-col" data-status="TODO">
                <div class="col-header">
                    <span class="col-title"><i class="fa-regular fa-circle"></i> To Do</span>
                    <span class="count-badge" id="count-TODO">0</span>
                </div>
                <div class="col-cards" id="cards-TODO"></div>
            </div>

            <div class="kanban-col" data-status="IN_PROGRESS">
                <div class="col-header">
                    <span class="col-title"><i class="fa-solid fa-spinner"></i> In Progress</span>
                    <span class="count-badge" id="count-IN_PROGRESS">0</span>
                </div>
                <div class="col-cards" id="cards-IN_PROGRESS"></div>
            </div>

            <div class="kanban-col" data-status="IN_REVIEW">
                <div class="col-header">
                    <span class="col-title"><i class="fa-solid fa-glasses"></i> In Review</span>
                    <span class="count-badge" id="count-IN_REVIEW">0</span>
                </div>
                <div class="col-cards" id="cards-IN_REVIEW"></div>
            </div>

            <div class="kanban-col" data-status="COMPLETED">
                <div class="col-header">
                    <span class="col-title"><i class="fa-solid fa-circle-check"></i> Completed</span>
                    <span class="count-badge" id="count-COMPLETED">0</span>
                </div>
                <div class="col-cards" id="cards-COMPLETED"></div>
            </div>
        </div>
    </main>
</div>

<!-- Create/Edit Task Modal -->
<div class="modal-overlay" id="taskModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3 class="modal-title" id="taskModalTitle">Create Task</h3>
            <button class="close-btn" id="btnCloseTaskModal">&times;</button>
        </div>
        <form id="taskForm">
            <input type="hidden" id="taskId">
            <div class="form-group">
                <label class="form-label" for="taskTitle">Task Title *</label>
                <input type="text" id="taskTitle" class="form-input" placeholder="e.g. Implement user login API" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="taskAssignee">Assign To</label>
                <select id="taskAssignee" class="form-select">
                    <option value="">👥 All Members (Visible to Everyone)</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="taskPriority">Priority</label>
                    <select id="taskPriority" class="form-select">
                        <option value="LOW">Low</option>
                        <option value="MEDIUM" selected>Medium</option>
                        <option value="HIGH">High</option>
                        <option value="URGENT">Urgent</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="taskStatus">Status</label>
                    <select id="taskStatus" class="form-select">
                        <option value="TODO">To Do</option>
                        <option value="IN_PROGRESS">In Progress</option>
                        <option value="IN_REVIEW">In Review</option>
                        <option value="COMPLETED">Completed</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="taskStartDate">Start Date</label>
                    <input type="date" id="taskStartDate" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label" for="taskDueDate">Due Date</label>
                    <input type="date" id="taskDueDate" class="form-input">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="taskProgress">Progress (<span id="progressVal">0</span>%)</label>
                <input type="range" id="taskProgress" min="0" max="100" value="0" class="form-range">
            </div>

            <div class="form-group">
                <label class="form-label" for="taskDesc">Description</label>
                <textarea id="taskDesc" class="form-input" rows="3" placeholder="Task details..."></textarea>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn btn-outline" id="btnCancelTaskModal">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Task</button>
            </div>
        </form>
    </div>
</div>

<!-- Task Details & Comments Modal -->
<div class="modal-overlay" id="taskDetailModal">
    <div class="modal-box modal-large">
        <div class="modal-header">
            <h3 class="modal-title" id="viewTaskTitle">Task Details</h3>
            <button class="close-btn" id="btnCloseDetailModal">&times;</button>
        </div>
        <div class="task-detail-content">
            <div class="detail-meta">
                <span class="badge" id="viewPriority"></span>
                <span class="badge" id="viewStatus"></span>
                <span class="badge badge-assignee" id="viewAssignee"></span>
                <span class="detail-date"><i class="fa-regular fa-clock"></i> Due: <span id="viewDueDate"></span></span>
            </div>
            <p class="detail-desc" id="viewDescription"></p>

            <div class="comments-section">
                <h4>Comments & Discussions</h4>
                <div class="comment-list" id="commentList"></div>
                <form id="commentForm" class="comment-input-box">
                    <input type="text" id="commentInput" class="form-input" placeholder="Write a comment..." required>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i></button>
                </form>
            </div>
        </div>
        <div class="modal-actions">
            <button type="button" class="btn btn-danger" id="btnDeleteTask"><i class="fa-solid fa-trash"></i> Delete</button>
            <button type="button" class="btn btn-outline" id="btnEditTask"><i class="fa-solid fa-pen"></i> Edit</button>
            <button type="button" class="btn btn-outline" id="btnCloseDetailBtn">Close</button>
        </div>
    </div>
</div>

<script src="js/tasks.js"></script>
</body>
</html>
