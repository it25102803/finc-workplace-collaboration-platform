<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Channels & Chat | Finc Workplace</title>

    <!-- Apply the saved light/dark choice before the page paints (no flash).
         data-bs-theme makes the Bootstrap inputs and selects follow the same theme. -->
    <script>
        (function () {
            try {
                const theme = localStorage.getItem("theme") || "light";
                document.documentElement.setAttribute("data-theme", theme);
                document.documentElement.setAttribute("data-bs-theme", theme);
            } catch (e) {}
        })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/channels-style.css">
    <link rel="stylesheet" href="css/channels-theme.css">
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.1.1/bundles/stomp.umd.min.js"></script>
    <script src="js/api.js"></script>
    <link rel="stylesheet" href="css/brand.css">
</head>
<body class="channels-page">
<div class="app-shell">

    <!-- APP NAVIGATION (same as the other pages) -->
    <aside class="app-nav">

        <div class="brand">
            <div class="brand-logo-card">
                <img src="images/finc-logo.png" alt="Finc Academy & Consultants" class="brand-logo-img" onerror="this.onerror=null; this.src='images/Finc_Main.jpg';">
            </div>
            <div class="brand-portal-title">
                <span class="title">Enterprise</span>
                <span class="subtitle">Portal</span>
            </div>
        </div>

        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-link-item"><i class="fa-solid fa-chart-pie"></i><span>Overview</span></a>
            <a href="user-directory.html" id="userDirectoryLink" class="nav-link-item" style="display: none;"><i class="fa-solid fa-users"></i><span>User Directory</span></a>
            <a href="channels.html" class="nav-link-item active"><i class="fa-solid fa-comments"></i><span>Channels & Chat</span></a>
            <a href="tasks.html" class="nav-link-item"><i class="fa-solid fa-list-check"></i><span>Task Management</span></a>
            <a href="calendar.html" class="nav-link-item"><i class="fa-solid fa-calendar-days"></i><span>Calendar & Meetings</span></a>
            <a href="files.html" class="nav-link-item"><i class="fa-solid fa-folder-open"></i><span>File Manager</span></a>
            <a href="knowledge-base.html" class="nav-link-item"><i class="fa-solid fa-book"></i><span>Knowledge Base</span></a>
            <a href="admin-settings.html" id="adminSettingsLink" class="nav-link-item" style="display: none;"><i class="fa-solid fa-gear"></i><span>Admin Settings</span></a>
        </nav>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main-panel">

        <!-- TOP BAR -->
        <header class="workspace-header">

            <div class="header-title">
                <!-- Kept for the chat script (it toggles the conversation list on small screens) -->
                <button id="sidebarToggle" class="sidebar-toggle" type="button" title="Toggle conversations" aria-label="Toggle conversations">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div>
                    <h1 id="chatTitle">General</h1>
                    <span id="channelMeta" class="meta-text">Project updates</span>
                </div>
            </div>

            <div class="header-actions">
                <div class="conversation-search">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input id="conversationSearch" type="search" placeholder="Search conversations..."
                           autocomplete="off" aria-label="Search previous conversations">
                    <div id="searchResults" class="search-results hidden" role="listbox"></div>
                </div>

                <div class="header-icon-group">
                    <button id="renameChannelBtn" class="icon-btn hidden" type="button" title="Rename conversation" aria-label="Rename conversation">
                        <i class="fa-solid fa-pen"></i>
                    </button>
                    <button id="refreshBtn" class="icon-btn" type="button" title="Refresh" aria-label="Refresh">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                    <button id="notificationBtn" class="icon-btn notification-button" type="button" title="Notifications" aria-label="Notifications">
                        <i class="fa-regular fa-bell"></i>
                        <span id="notificationCount" class="notification-count hidden">0</span>
                    </button>
                    <button type="button" class="icon-btn theme-toggle-btn" data-theme-toggle title="Light / dark mode" aria-label="Toggle dark mode">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                </div>
            </div>

            <div id="notificationPanel" class="notification-panel hidden"></div>

        </header>


        <div class="content-layout">

            <!-- CONVERSATIONS (channels + direct messages) -->
            <aside class="sidebar conversations-panel">

                <div class="side-section">
                    <div class="section-header">
                        <span>Channels</span>
                        <button id="createChannelBtn" class="section-add-btn" type="button" title="Create channel" aria-label="Create channel">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                    <div id="channelList" class="channel-list"></div>
                </div>

                <div class="side-section">
                    <div class="section-header">
                        <span>Direct messages</span>
                    </div>
                    <div id="directMessageList" class="channel-list"></div>
                </div>

            </aside>

            <button id="sidebarBackdrop" class="sidebar-backdrop" type="button" aria-label="Close conversations"></button>


            <!-- CHAT -->
            <section class="chat-panel">

                <div id="pinnedMessages" class="pinned-messages hidden" aria-label="Pinned messages"></div>
                <div id="messageList" class="message-list"></div>

                <p id="attachmentStatus" class="attachment-status" role="status" aria-live="polite" hidden>
                    <span id="attachmentStatusText"></span>
                    <button id="clearAttachmentBtn" class="attachment-clear-button" type="button"
                            aria-label="Remove selected attachment" title="Remove selected attachment" hidden>
                        &times;
                    </button>
                </p>

                <form id="messageForm" class="composer">
                    <label class="composer-btn attachment-button" title="Attach an image or file">
                        <i class="fa-solid fa-paperclip"></i>
                        <input id="attachmentInput" type="file" accept="image/*,audio/*,*/*" hidden>
                    </label>

                    <!-- The chat script changes this button's text while recording; the mic icon comes from CSS -->
                    <button id="voiceMessageBtn" class="composer-btn voice-btn" type="button"
                            title="Record a voice message">Record voice</button>

                    <input
                            id="messageInput"
                            class="form-control"
                            type="text"
                            maxlength="500"
                            placeholder="Type a message..."
                            autocomplete="off">

                    <button type="submit" class="send-btn" title="Send">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>Send</span>
                    </button>
                </form>

            </section>


            <!-- PEOPLE -->
            <aside class="right-panel">

                <div class="panel-card">

                    <h3>People here</h3>

                    <div class="member-toolbar">
                        <select id="memberSelector" class="form-select"></select>
                        <button id="addMemberBtn" class="add-member-btn" type="button">
                            <i class="fa-solid fa-user-plus"></i> Add
                        </button>
                    </div>

                    <ul id="memberList" class="member-list"></ul>

                </div>

            </aside>

        </div>

    </main>
</div>


<!-- CHANNEL MODAL -->
<div id="channelModal" class="modal hidden">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Create channel</h2>

            <button id="closeChannelModalBtn" class="close-button btn btn-link">
                ×
            </button>

        </div>


        <form id="channelForm">

            <label>
                Channel name

                <input
                        id="channelName"
                        class="form-control"
                        type="text"
                        required
                        placeholder="e.g. support-team">
            </label>


            <label>
                Description

                <input
                        id="channelDescription"
                        class="form-control"
                        type="text"
                        placeholder="Optional description">
            </label>

            <label>
                Department (optional)

                <input
                        id="channelDepartment"
                        class="form-control"
                        type="text"
                        placeholder="e.g. Finance">
            </label>


            <label>
                Visibility

                <select id="channelType" class="form-select">
                    <option value="PUBLIC">Public</option>
                    <option value="PRIVATE">Private</option>
                    <option value="DIRECT">Direct</option>
                </select>
            </label>


            <div class="modal-actions">

                <button
                        type="button"
                        id="cancelChannelModalBtn"
                        class="secondary-button btn btn-outline-secondary">
                    Cancel
                </button>

                <button
                        type="submit"
                        class="primary-button btn btn-primary">
                    Create
                </button>

            </div>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/presence.js"></script>
<script>
    // Show Admin Settings link only for SYSTEM_ADMIN users
    (function () {
        const role = (localStorage.getItem("role") || "").replace("ROLE_", "");
        const link = document.getElementById("adminSettingsLink");
        if (link && role === "SYSTEM_ADMIN") {
            link.style.display = "";
        }
    })();

    // Keep Bootstrap's own colour mode in step with the shared light/dark switch
    new MutationObserver(function () {
        document.documentElement.setAttribute("data-bs-theme",
            document.documentElement.getAttribute("data-theme") || "light");
    }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
</script>
<script src="js/roleguard.js"></script>
<script src="js/theme.js"></script>
<script src="js/channels-app.js?v=20261114-ui"></script>
</body>
</html>
